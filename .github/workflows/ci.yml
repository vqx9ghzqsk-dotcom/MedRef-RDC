name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouvel envoi annule le contrôle encore en cours sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint, tests, migrations, sauvegardes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        # Même version majeure que le MySQL de WAMP utilisé en local
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medref_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      JWT_SECRET: ci-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: medref_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Tests unitaires (Jest + Supertest)
        run: npm test -- --testPathIgnorePatterns integration
      - name: Tests d'intégration (MySQL 8.4)
        run: npm run test:integration
        env:
          DB_INTEGRATION: '1'
      - name: Réinitialisation, migrations et sauvegarde depuis une base vide
        env:
          BACKUP_DIR: ${{ runner.temp }}/sauvegardes
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE medref_test; CREATE DATABASE medref_test"
          npm run db:migrate
          npm run db:reset
          npm run db:enrichir
          npm run db:migrate
          npm run db:status
          npm run db:backup
          npm run db:backup -- --liste

  frontend:
    name: Interface (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
