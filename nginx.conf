server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API → conteneur backend
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Photos des produits → conteneur backend
  location /medias/ {
    proxy_pass http://api:4000;
    expires 30d;
  }

  # Le service worker doit toujours être revalidé pour que les mises à jour arrivent
  location = /service-worker.js {
    add_header Cache-Control "no-cache";
  }

  # Ressources fingerprintées par Vite : cache long
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Application monopage : toute autre route renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
